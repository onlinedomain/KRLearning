<!DOCTYPE html>
<html lang="fr" data-style="hanji" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>다독+ · Lecture coréenne</title>
  <meta name="description" content="Lecteur gradué de coréen (niveaux 1 à 4) : textes, audio, banque de mots et flashcards.">
  <meta name="theme-color" content="#FAF6EE">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="다독+">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint (no flash).
    try {
      var s = (JSON.parse(localStorage.getItem('dadok-plus.v1')) || {}).settings || {};
      var m = s.mode || 'auto';
      if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.style = s.style || 'hanji';
      document.documentElement.dataset.mode = m;
      document.documentElement.style.colorScheme = m;
      // Status bar colour right from the first frame (app.js keeps it in sync after).
      var BG = { hanji: ['#FAF6EE', '#1A1613'], clair: ['#F5F6FB', '#11131B'], jade: ['#F2F6F2', '#0F1613'], encre: ['#FFFFFF', '#0D0D0D'] };
      document.querySelector('meta[name="theme-color"]').content = (BG[s.style || 'hanji'] || BG.hanji)[m === 'dark' ? 1 : 0];
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="다독+ · retour à la bibliothèque"><span class="brand-ko">다독</span><span class="brand-plus">+</span></a>
    <nav class="topnav" aria-label="Navigation principale"></nav>
    <div class="topbar-right"></div>
    <button class="icon-btn burger" data-action="drawer-open" aria-label="Ouvrir le menu" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <div class="drawer-scrim" data-action="drawer-close" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head">
      <span class="brand"><span class="brand-ko">다독</span><span class="brand-plus">+</span></span>
      <button class="icon-btn" data-action="drawer-close" aria-label="Fermer le menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="drawer-nav"></nav>
    <div class="drawer-foot"></div>
  </aside>

  <main id="view" tabindex="-1"><div class="loading">Chargement…</div></main>

  <a class="fab" hidden></a>
  <button class="to-top" type="button" aria-label="Revenir en haut de la page" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>
  <nav class="tabbar" aria-label="Navigation rapide"></nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
